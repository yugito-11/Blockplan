name: Windows-Version bauen

# Baut Blockplan.exe bei jeder Änderung am Programm. Ist die Version (<Version> in Blockplan.csproj)
# neu, wird sie als Release v<Version> veröffentlicht; sonst gibt es die .exe nur als Build-Ergebnis.
on:
  push:
    branches: [main]
    paths: ["src/**", "mod/dist/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Bauen
        run: >
          dotnet publish src/Blockplan -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out
      - name: Release veröffentlichen (nur bei neuer Version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP '(?<=<Version>)[^<]+' src/Blockplan/Blockplan.csproj)
          if gh release view "v$VER" >/dev/null 2>&1; then echo "Release v$VER gibt es schon."; exit 0; fi
          gh release create "v$VER" out/Blockplan.exe mod/dist/*.jar --target "$GITHUB_SHA" \
            --title "Blockplan $VER" \
            --notes "Herunterladen: Blockplan.exe unten anklicken, speichern, doppelklicken. Windows warnt beim ersten Start (nicht signiert): „Weitere Informationen“ → „Trotzdem ausführen“. Die Datei blockplan-live-*.jar gehört in den mods-Ordner des Minecraft-Servers (Fabric) und liefert die Live-Verbindung."
      - uses: actions/upload-artifact@v4
        with:
          name: Blockplan
          path: out/Blockplan.exe
