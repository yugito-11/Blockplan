name: Windows-Version bauen

# Baut Blockplan.exe und veröffentlicht sie als Release, sobald ein Versions-Tag (z. B. v1.0.1) hochgeladen wird.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Bauen
        run: >
          dotnet publish src/Blockplan -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out
      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/Blockplan.exe \
            --title "Blockplan ${GITHUB_REF_NAME#v}" \
            --notes "Herunterladen: Blockplan.exe unten anklicken, speichern, doppelklicken. Windows warnt beim ersten Start (nicht signiert): „Weitere Informationen“ → „Trotzdem ausführen“."
      - uses: actions/upload-artifact@v4
        with:
          name: Blockplan
          path: out/Blockplan.exe
